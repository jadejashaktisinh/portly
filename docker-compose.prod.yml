name: portly-prod

services:
  postgres_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-portly}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  portly:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres_db:5432/${POSTGRES_DB:-portly}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: "10000"
    depends_on:
      - postgres_db
    restart: unless-stopped

volumes:
  prod_postgres_data:
